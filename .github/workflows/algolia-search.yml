# Example for sites using Algolia: copy this workflow and adapt the branches,
# Ruby version and jekyll_src. Configure the ALGOLIA_API_KEY repository secret.
# Installing the theme does not install or enable this workflow in another repo.
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

name: algolia-search
permissions:
  contents: read

jobs:
  algolia-search:
    runs-on: ubuntu-latest
    env:
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Algolia Jekyll Action
        uses: dieghernan/algolia-jekyll-action/@main
        with:
          APIKEY: '${{ secrets.ALGOLIA_API_KEY }}'
          jekyll_src: docs
          ruby-version: '3.1'
