name: Index docs in Cloudflare AI Search

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-search-indexing
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 1
          working-directory: docs

      - name: Build docs with Jekyll
        run: bundle exec jekyll build --baseurl "/chulapa"
        working-directory: docs
        env:
          JEKYLL_ENV: production

      - name: Sync docs to Cloudflare AI Search
        run: node scripts/sync-ai-search.mjs docs/_site/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_SEARCH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_SEARCH_INSTANCE: chulapa-ai-search
