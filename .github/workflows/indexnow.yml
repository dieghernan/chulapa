name: IndexNow

on:
  workflow_run:
    workflows:
      - "Deploy Chulapa Jekyll site to Pages"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    name: Submit changed URLs to IndexNow
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      INDEXNOW_SITE: 'https://dieghernan.github.io/chulapa'
      INDEXNOW_KEY: '482ca4f8918044ceaf2760339d398cb5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find changed pages
        shell: bash
        run: |
          git fetch origin gh-pages

          git diff \
            --name-only \
            --diff-filter=AMD \
            origin/gh-pages^ \
            origin/gh-pages \
            -- '*.html' \
            > changed-pages.txt

          echo "Changed HTML pages:"
          cat changed-pages.txt

      - name: Submit URLs to IndexNow
        shell: bash
        run: |
          if [ -s changed-pages.txt ]; then
            mapfile -t pages < changed-pages.txt
            node scripts/indexnow.mjs "${pages[@]}"
          else
            echo "IndexNow: no changed HTML pages to submit."
          fi