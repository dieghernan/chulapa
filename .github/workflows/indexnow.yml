name: IndexNow

on:
  workflow_run:
    workflows:
      - "Deploy Chulapa Jekyll site to Pages"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    name: Submit URLs to IndexNow
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      INDEXNOW_SITE: 'https://dieghernan.github.io/chulapa'
      INDEXNOW_KEY: '482ca4f8918044ceaf2760339d398cb5'
      INDEXNOW_SINCE_HOURS: '24'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Submit URLs to IndexNow
        run: node scripts/indexnow.mjs
 