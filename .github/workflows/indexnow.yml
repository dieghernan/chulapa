name: IndexNow

on:
  workflow_dispatch:

jobs:
  indexnow:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-latest

    steps:
      - name: Submit URLs
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: 'https://dieghernan.github.io/chulapa/sitemap.xml'
          key: '9679ace7976c49139311656d3c628c4e'
          endpoint: api.indexnow.org
          since: 1
          since-unit: day
          failure-strategy: error
 