name: Theme regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gemfile: [test/Gemfile, test/jekyll3/Gemfile]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check theme behavior on Jekyll 3 and 4
        working-directory: test
        run: bundle exec ruby run_regressions.rb

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check experimental skin artifact drift detection
        run: node test/check_dark_skin_pilot_artifacts.js
      - name: Check theme JavaScript and highlighting
        run: node --test test/check_chulapa_script.js test/check_mermaid.mjs test/check_photoswipe.mjs test/check_highlighting_security.js

  chatbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/ai-chatbot/package-lock.json
      - name: Install chatbot test dependencies
        working-directory: docs/ai-chatbot
        run: npm ci
      - name: Check Worker, deployment bundle, answer rendering and widget
        working-directory: docs/ai-chatbot
        run: npm test

  installation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gemfile: [test/installation/Gemfile, test/jekyll3/Gemfile]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Package the current theme
        run: gem build chulapa-jekyll.gemspec
      - name: Verify installed gem, pagination, sitemap and documentation
        working-directory: test
        run: bundle exec ruby check_theme_installation.rb

  dark-skin-pilot:
    name: Experimental dark skin artifact drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Playwright 1.62.1, Ubuntu Noble, browser binaries and system fonts together.
    # Keep this digest in sync with the documented snapshot environment.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    env:
      DARK_SKIN_PILOT_OUTPUT: ${{ runner.temp }}/chulapa-dark-skin-pilot
    steps:
      - uses: actions/checkout@v7
      - name: Install locked pilot dependencies
        run: npm ci --prefix test/browser
      - name: Regenerate and compare real pilot artifacts
        run: node test/generate_dark_skin_pilot.js --check
      - name: Retain rendered candidates for drift diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-skin-pilot-candidates
          path: |
            ${{ env.DARK_SKIN_PILOT_OUTPUT }}/*-comparison-*.png
            ${{ env.DARK_SKIN_PILOT_OUTPUT }}/summary.json
            ${{ env.DARK_SKIN_PILOT_OUTPUT }}/report.json
          if-no-files-found: ignore
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/test/Gemfile
      NODE_PATH: ${{ github.workspace }}/test/browser/node_modules
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      - name: Install isolated browser tools
        run: |
          npm ci --prefix test/browser
          test/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check skin identity and contrast regressions
        run: |
          node test/check_skin_contrast.js
          node test/check_skin_contrast_browser.js
          node test/check_skin_contrast_states_browser.js
          node test/check_flatly_alerts_browser.js
          node test/check_bootswatch_originals_browser.js
          node test/check_bootswatch_adaptations_browser.js
          node test/check_tophat_browser.js
          node test/check_skin_button_overrides_browser.js
      - name: Build actual theme fixtures
        working-directory: test
        run: |
          DEFAULT_CONTENT_OUTPUT="$RUNNER_TEMP/chulapa-default-content" bundle exec ruby check_default_content.rb
          bundle exec ruby build_accessibility_fixtures.rb "$RUNNER_TEMP/chulapa-navigation"
          bundle exec ruby check_photoswipe.rb "$RUNNER_TEMP/chulapa-photoswipe"
          bundle exec ruby build_javascript_fixtures.rb "$RUNNER_TEMP/chulapa-javascript"
          bundle exec ruby check_theme_selector.rb "$RUNNER_TEMP/chulapa-theme-selector"
          bundle exec ruby build_theme_font_fixtures.rb "$RUNNER_TEMP/chulapa-theme-fonts"
      - name: Check keyboard navigation and responsive state in Chromium
        run: |
          node test/check_default_content_browser.js "$RUNNER_TEMP/chulapa-default-content"
          node test/check_navigation_browser.js "$RUNNER_TEMP/chulapa-navigation"
          node test/check_photoswipe_browser.js "$RUNNER_TEMP/chulapa-photoswipe"
          node test/check_javascript_browser.js "$RUNNER_TEMP/chulapa-javascript"
          node test/check_theme_selector_browser.js "$RUNNER_TEMP/chulapa-theme-selector"
          node test/check_theme_fonts_browser.js "$RUNNER_TEMP/chulapa-theme-selector" "$RUNNER_TEMP/chulapa-theme-fonts"
