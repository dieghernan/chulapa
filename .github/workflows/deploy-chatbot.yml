name: Deploy chatbot

on:
  workflow_run:
    workflows: [Deploy Chulapa Jekyll site to Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-chatbot
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/ai-chatbot
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/ai-chatbot/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test
      - name: Wait for the matching Pages deployment
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: bash wait-for-pages.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.150.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
