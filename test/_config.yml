# Chulapa gem installation test site
# Sections follow https://dieghernan.github.io/chulapa/docs/02-config

# Installation
theme: chulapa-jekyll
github: [metadata]

# A. Site settings/SEO
# General site settings
locale                  :     #default["en-US"] format language-TERRITORY , e.g fr, en-GB, es-MX, pt-BR
title                   : Chulapa 101    #default["repository_name"]
title_separator         :     #default [" | "]
subtitle                : Chulapa Jekyll Theme starter pack    #default [your-repository-tagline]
description             : Chulapa Jekyll Theme starter pack #default [your-repository-tagline]
url                     :     #See baseurl - On Github Pages you may leave it blank - If you use CNAME use your domain
baseurl                 :     #On Github Pages you may leave it blank. Have a look to: https://byparker.com/blog/2014/clearing-up-confusion-around-baseurl/
repository: dieghernan/chulapa-jekyll-101
words_per_minute        :     #default[200]
timezone                :     #"Europe/Madrid ,see https://jekyllrb.com/docs/configuration/options/ and https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# A.1. SEO
# Optional og_locale and og_locale_alternate: docs/04-layouts#social-locales-and-articles.
og_image                :     #default[author.avatar (see below)] or [github-avatar]
twitter_site            :     #Avoid @
author:
  name                  :  Your Name   # Name Surname Company
  avatar                :     # Try a square file. Info: Your github avatar on https://github.com/[USERNAME].png
  location              :  "Madrid, Spain"   # New York, USA
#  links:
#    - url:  #A link or email: https://twitter.com/jack, mail@example.com
#      icon: # A Font Awesome code: fab fa-twitter - see https://fontawesome.com/
#    - url:  # Another link
#      icon: # Another FontAwesome code

# A.1.1. Publisher
# Optional publisher settings use the default organization and author fallbacks.
# See docs/02-config#publisher.

# A.2. Font Awesome
fa_version: #default ["6"] Use 6 or 5
fa_kit_code: # Your FontAwesome kit code. If not provided a free hosted version (slower) will be loaded:  https://fontawesome.com/
fa_v4_support: #Bool Add FontAwesome 4 support
# A.3. Google Analytics
# Use a GA4 measurement ID (G-XXXXXXXXXX) for gtag_id.
# analytics_id is retained for legacy Universal Analytics. Leave unused IDs empty.
gtag_id                 :
analytics_id            :

# A.4. Search engines
# Create a page with layout: search and a permalink matching landing_page.
# Available free search engines:
# - lunr https://lunrjs.com/
# - algolia v4 https://www.algolia.com/ - needs further configuration
# - google custom search engine https://cse.google.es/
search:
  provider              : lunr # Enable search: lunr, algolia, google, simplesearch or fusejs.
  label                 :  #default ["Search"] Text on navbar when search is enabled
  landing_page          :  #default ["/search"] Link on navbar
  maxwords         :  # Default: 30. Used by lunr, simplesearch and fusejs.
  algolia_logo          :  true # Check your plan's attribution requirements before hiding the logo.

google_cse_id: #Your cse id
# Algolia indexing options; unused when provider is lunr.
algolia:
  application_id        :
  index_name            :
  search_only_api_key   :
  files_to_exclude:         #Optional
    - _layouts/*.html
    - _includes/*.html
  extensions_to_index:      #Optional
    - html
    - md
  searchableAttributes:     #Optional
    - title
    - headings
    - unordered(content)
    - unordered(subtitle)
    - unordered(categories)
    - unordered(collection)
    - unordered(tags)
  customRanking:            #Optional
    - desc(include_on_search)
    - desc(title)
    - desc(content)
    - desc(subtitle)

# A.5. Comments
# Enable show_comments on pages; giscus uses _includes/custom/giscus.html.
comments:
  provider:         # disqus, cusdis, giscus, cactus or welcomments
  disqus_shortname: #Your site id : check your address https://{{ disqus.shortname }}.disqus.com/admin/

# B. Navigation
# Configure your navbar and the footer of your site

# B.1. Navbar
#   "brand" options would be set on the left side of your navbar
#   "nav" would be set on the right side. Two-level nav links available
navbar:
  style     :  #default is the classical top navbar, set "fab" for a floating action button navbar or "dual"
  expand    :  # At which device size expand the navbar menu. default[md] https://getbootstrap.com/docs/4.5/layout/overview/
  brand:
    title   :  Home # Title in navbar
    url     :  # default["url/baseurl"]
    img     :  # A small image, ideally 30x30px.
  nav:
  - title   : Blog # Label
    url     : /blog/ # url
  - title   : Cheatsheets
    url     : /cheatsheets
  - title   : Extras
    child   :
      - title : Tags
        url   : /tags
      - title : Categories
        url   : /categories
      - title : Archive
        url   : /archive
      - title : Current skin
        url   : /current-skin
  - title   : Docs
    url     : https://dieghernan.github.io/chulapa/docs/01-install
  - title   : Use this template
    url     : https://github.com/dieghernan/chulapa-101/generate
#  - title   : # Label submenu
#    child:
#    - title: # Child label
#      url  : # child url
#    - title: # Child label
#      url  : # child url
# B.2. Footer
footer:
  links:
    - label : Repo on GitHub # Label
      icon  : fab fa-github # Font Awesome icon
      url   : https://github.com/dieghernan/chulapa-101 # A link or email: https://twitter.com/jack, mail@example.com
    - label: "RSS"
      icon: "fa fa-rss"
      url:  "./atom.xml"
  copyright: # default is © <year> <name>

# C. Theming Chulapa
# Full reference: docs/03-theming.
# C.1. Google Fonts
# Google Fonts https://fonts.google.com/, add as many as you need
googlefonts:
 # - url : # 'https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap'

# C.2. Skin, syntax highlighting and colors
chulapa-skin:
  highlight     :  skeletor # default["default"]
  skin         :   twitter-dim # Optional predefined skins
  autothemer    :  true # Bool: Use autotheming
  vars          :
    primary     : #default ["#007bff"] - Bootstrap blue

# D. Jekyll defaults and collections

# D.1. Pagination
# Blog pagination: on this site /blog/index.html. https://jekyllrb.com/docs/pagination/
paginate: 4
paginate_path: "/blog/page:num/"
paginator_maxnum: 3  #default[3] Custom: max of number to be displayed on the paginator

# D.2. Collections and permalinks
# https://jekyllrb.com/docs/step-by-step/09-collections/
collections:
  cheatsheet:
    output: true
    permalink: /cheatsheets/:name
collections_dir     :
permalink           : /:year:month:day_:title/

# D.3. Front matter defaults
# Theme page options: docs/04-layouts.
# https://jekyllrb.com/docs/configuration/front-matter-defaults/
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      header_type: "base"
      include_on_search   : false
      cloudtag_url        : /tags #This is where the link on tags would redirect
      cloudcategory_url   : /categories #This is where the link on categories would redirect
  -
    scope:
      path: ""
      type: "posts"
    values:
      header_type       : "post"
      include_on_search : true
      include_on_feed   : true
      show_date         : true
      show_bottomnavs   : true
      show_sociallinks  : true
      show_comments     : true
      show_tags         : true
      show_categories   : true
      show_author       : true
      show_breadcrumb   : true
      breadcrumb_list   :
        - label: Blog
          url: /blog/
  -
    scope:
      path: ""
      type: "cheatsheet"
    values:
      header_type       : "hero"
      show_bottomnavs   : true
      show_sociallinks  : true
      include_on_search : true
      show_breadcrumb   : true
      breadcrumb_list   :
        - label: Cheatsheets
          url: /cheatsheets

# XX. Other settings
# Adapt these settings to the test site; keep jekyll-include-cache enabled.
# XX.1. HTML compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  blanklines: true

# XX.2. Plugins
plugins:
  - jekyll-github-metadata
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-sitemap

# XX.3. Files to exclude or include
exclude:
  - LICENSE
  - README.md
  - Gemfile
  - vendor

include:
 - _pages

# XX.4. Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# XX.5. Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: '&uarr;'
  entity_output: as_char
  toc_levels: 2..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# XX.6. Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

