{% assign size = page.tags | size %}
{% if size > 0 %}
<div class="container-lg my-1">
  <div class="row">
    <div class="col-lg-8 offset-lg-2 col d-flex align-items-start">
      <div>
        <i class="fas fa-tag mt-2 mr-1 fa-xs" aria-hidden="true"></i>
      </div>
      <div>
      {%- for tag in page.tags %}
        {%- include snippets/cloud-fragment.html label=tag field='tags' -%}
        <a href="{{- cloud_fragment_id | url_encode | prepend: '#' |
        prepend: page.cloudtag_url |
        absolute_url | uri_escape | escape -}}" class="badge chulapa-pill-bg-primary mt-1 p-category" rel="tag" >{{- tag | escape -}}</a>
      {% endfor -%}
      </div>
    </div>
  </div>
</div>
{% endif %}
