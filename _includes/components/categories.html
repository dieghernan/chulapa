{% assign size = page.categories | size %}
{% if size > 0 %}
<div class="container-lg my-1">
  <div class="row">
    <div class="col-lg-8 offset-lg-2 col d-flex align-items-start">
      <div>
        <i class="far fa-folder-open mt-2 mr-1 fa-xs" aria-hidden="true"></i>
      </div>
      <div class="d-flex flex-wrap">
      {%- for category in page.categories %}
        <a href="{{- category | replace: " ", "-" | prepend: "#" |
                     prepend: page.cloudcategory_url |
                     absolute_url | uri_escape -}}" class="badge chulapa-pill-bg-secondary mt-1 p-category" rel="tag">{{- category -}}</a>
      {% endfor -%}
      </div>
    </div>
  </div>
</div>
{% endif %}
