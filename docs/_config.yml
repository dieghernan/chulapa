# Chulapa documentation and demo site
# Sections follow https://dieghernan.github.io/chulapa/docs/02-config

# Installation
github: [metadata]

remote_theme: dieghernan/chulapa

# A. Site settings/SEO
# General site settings
title: Chulapa
subtitle: A full flexible Jekyll theme
description: Template for creating free sites on GitHub Pages
repository: dieghernan/chulapa
url: "https://dieghernan.github.io"
baseurl: "/chulapa"
timezone: "Europe/Madrid"

# A.1. SEO
# Optional social locales: docs/04-layouts#social-locales-and-articles.
og_image: "./assets/img/site/banner.png"
twitter_site: dhernangomez
# Site author
author:
  name: dieghernan
  avatar: ./assets/img/site/dieghernan-avatar.png
  location: Madrid, Spain
  links:
  - url: https://github.com/dieghernan/
    icon: "fab fa-github"
    label: GitHub
  - url: https://dieghernan.github.io/
    icon: fas fa-blog
    label: Blog
  - url: https://stackoverflow.com/users/7877917/dieghernan
    icon: "fab fa-stack-overflow"
    label: StackOverflow
# A.1.1. Publisher
# Optional JSON-LD publisher, independent of article authors.
publisher:
  type: Person # Personal site demo; Organization is the default
  name: # Defaults to author.name or GitHub owner name
  url: # Defaults to the site home URL
  logo: # Organization only; defaults to og_image, author.avatar or GitHub avatar
  image: # Person defaults to author.avatar or GitHub avatar; optional for Organization

# A.2. Font Awesome
# Omitted settings use Font Awesome 6 without a kit or v4 support.

# A.3. Google Analytics
gtag_id: G-Q654SQGBGS

# A.4. Search engines
# Algolia is the main search provider; Google CSE is used by the demo page.
search:
  provider: algolia
  algolia_logo: true
google_cse_id: 002514516175957445995:tvgnhtemtbu

# Algolia indexing options; search_only_api_key is a public search key.
algolia:
  application_id: "KOIKA5PDQO"
  index_name: "chulapa"
  search_only_api_key: "7f1fe42bef3f03458cb3a911ebc7e0ac"
  files_to_exclude:
  - _layouts/*.html
  - _includes/*.html
  - _pages/liquid*
  - assets/widgets/music-scales.html
  extensions_to_index:
  - html
  - md
  searchableAttributes:
  - title
  - headings
  - unordered(content)
  - unordered(subtitle)
  - unordered(categories)
  - unordered(collection)
  - unordered(tags)
  customRanking:
  - desc(include_on_search)
  - desc(title)
  - desc(content)
  - desc(subtitle)

# Documentation assistant, separate from the theme configuration.
# No trailing slash on worker_url. Loaded on the homepage, /docs and collection docs.
docs_chat:
  enabled: true
  worker_url: "https://chulapa-ai-prototype.dieghernan.workers.dev"

# A.5. Comments
# giscus uses _includes/custom/giscus.html; other IDs support provider demos.
comments:
  provider: giscus
  cusdis_app_id: "ba6333c9-c7b1-4578-a932-e9ee3e71f120"
  website_id: "XaFqz82GQETRJnLi7verVsyBS"

# B. Navigation
# B.1. Navbar
navbar:
  style: fab
  brand:
    title: Home
    img: "./assets/img/site/brand-white.png"
  nav:
  - title: Blog
    url: /blog/
  - title: Docs
    child:
    - title: Read the Docs
      url: /docs
    - title: Installation
      url: /docs/01-install
    - title: Global Settings
      url: /docs/02-config
    - title: Theming your site
      url: /docs/03-theming
    - title: Layouts & Snippets
      url: /docs/04-layouts
    - title: FAQs
      url: /docs/05-faq
    - title: Markdown cheatsheet
      url: /docs/markdown-cheatsheet
    - title: Syntax highlighting
      url: /docs/syntax-highlighting
    - title: Variable dictionary
      url: /docs/variable-dictionary
  - title: Skins
    url: /skins
  - title: Demos
    child:
    - title: Index
      url: /demo
    - title: Archive (all)
      url: /demo/archive
    - title: Tag Cloud (2 cols)
      url: /demo/tags
    - title: Category Cloud (single)
      url: /demo/category
    - title: Search Google CSE
      url: /demo/search_google
    - title: Search LUNR
      url: /demo/search_lunr
    - title: Search Fuse.js
      url: /demo/search_fusejs
    - title: Search Simple Jekyll Search
      url: /demo/search_simple
    - title: Minimal with header
      url: /demo/minimal-header
    - title: Classic Navbar
      url: /demo/classic-navbar
  - title: PageSpeed Results
    url: /pagespeed
  - title: About
    child:
    - title: License
      url: /license
    - title: Showcase
      url: /showcase
    - title: Contribute
      url: /contribute
    - title: Changelog
      url: https://github.com/dieghernan/chulapa/blob/master/CHANGELOG.md

# B.2. Footer
footer:
  links:
  - label: "RSS"
    icon: "fa fa-rss"
    url: "./atom.xml"
  - label: "GitHub"
    icon: "fab fa-github"
    url: https://github.com/dieghernan/
  - label: "My blog"
    icon: "fas fa-blog"
    url: "https://dieghernan.github.io/"
  copyright: "&copy; 2021 <span class='chulapa'>Chulapa</span> developers"

# C. Theming Chulapa
# Full reference: docs/03-theming.
# C.2. Skin, syntax highlighting and colors
chulapa-skin:
  highlight: "vs"
  skin: navi
  autothemer: true

# D. Jekyll defaults and collections
# These collections and defaults configure the documentation and demo site.

# D.1. Pagination
paginate: 4
paginate_path: "/blog/page:num/"
paginator_maxnum: 3

# D.2. Collections and permalinks
collections:
  demo:
    output: true
    permalink: /demo/:name
  docs:
    output: true
    permalink: /docs/:name
  skins:
    output: true
    permalink: /skins/:name
  posts:
    output: true
    permalink: /blog/:year:month:day_:title
collections_dir: collections
permalink: /:year:month:day_:title
# D.3. Front matter defaults
# Theme page options: docs/04-layouts.
defaults:

- scope:
    path: ""
  values:
    layout: "default"
    robots: "index, follow" # Override per page, e.g. "noindex, follow"
    header_type: "base"
    include_on_search: false
    cloudtag_url: "/tags"
    cloudcategory_url: "/categories"
    show_seo: true

- scope:
    path: ""
    type: "docs"
  values:
    header_type: "hero"
    show_sidetoc: true
    include_on_search: true
    show_bottomnavs: true
    show_comments: true
    show_breadcrumb: true
    og_image: "/assets/img/site/banner-docs.png"
    breadcrumb_list:
    - label: Home
      url: /
    - label: Docs
      url: /docs

- scope:
    path: ""
    type: "posts"
  values:
    header_type: "post"
    include_on_search: true
    include_on_feed: true
    show_date: true
    show_related: true
    show_bottomnavs: true
    show_sociallinks: true
    show_comments: true
    show_tags: true
    show_categories: true
    show_author: true
    show_breadcrumb: true
    breadcrumb_list:
    - label: Blog
      url: /blog/

- scope:
    path: ""
    type: "skins"
  values:
    header_type: "splash"
    cloudtag_url: "/demo/tags"
    og_image: '/assets/img/site/banner-skins.png'
    include_on_search: true
    show_date: true
    show_sociallinks: true
    show_comments: true
    show_tags: true
    show_categories: true
    show_related: true
    related_label: '<p><i class="fa-solid fa-right-left"></i></p>'
    show_random: true
    random_label: '<p><i class="fa-solid fa-shuffle"></i></p>'
    show_bottomnavs: true
    show_author: true
    show_toc: true
    show_sidetoc: true
    show_breadcrumb: true
    show_seo: false
    breadcrumb_list:
    - label: Skins
      url: /skins

- scope:
    path: ""
    type: "demo"
  values:
    layout: "default"
    header_type: "base"
    cloudtag_url: "/demo/tags"
    og_image: '/assets/img/site/banner-demos.png'
    include_on_search: true
    cloudcategory_url: "/demo/category"
    show_breadcrumb: true
    breadcrumb_list:
    - label: Demo
      url: /demo

- scope:
    path: "assets/img/gallery"
  values:
    image_col: gallery

# XX. Other settings
# Adapt these settings to the documentation site; keep jekyll-include-cache enabled.
# XX.1. HTML compression
compress_html:
  clippings: all
  blanklines: true

# XX.2. Plugins
plugins:
- jekyll-github-metadata
- jekyll-paginate
- jekyll-include-cache
- jekyll-sitemap
- jekyll-remote-theme

# XX.3. Files to exclude or include
exclude:
- AGENTS.md
- ai-chatbot
- LICENSE
- README.md
- Gemfile
- vendor
- www_src
include:
- _pages
- llms.txt

# XX.4. Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# XX.5. Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: '&uarr;'
  entity_output: as_char
  toc_levels: 2..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# XX.6. Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
  - import
  - global-builtin
  - color-functions
  - mixed-decls
  - abs-percent
  - function-units
